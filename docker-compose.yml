version: "3.8"

services:
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  run_migrations:
    build:
      context: .
      dockerfile: dockerfile
      args:
        - BUILD=development
    env_file:
      - ./.env
    command: sh -c "alembic revision --autogenerate && alembic upgrade head"
    volumes:
      - ./:/app/

  server:
    build:
      context: .
      dockerfile: dockerfile
      args:
        - BUILD=development
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    command: poetry run uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./:/app/

  tests:
    build:
      context: .
      dockerfile: dockerfile
      args:
        - BUILD=development
    env_file:
      - ./.env
    command: poetry run pytest ./tests/tests.py
    volumes:
      - ./:/app/

volumes:
  postgres_data:
    driver: local